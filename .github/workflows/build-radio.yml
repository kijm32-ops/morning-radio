name: Build Morning Radio

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: Source collector
        type: choice
        options: [gmail]
        default: gmail

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Ensure ffmpeg exists
        run: ffmpeg -version >/dev/null && ffprobe -version >/dev/null
      - name: Build episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m morning_radio.main --source-mode '${{ inputs.source_mode }}'
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-radio-${{ github.run_id }}
          path: |
            output/
            public/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          pattern: morning-radio-*
          merge-multiple: true
      - name: Send Kakao ready message
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_TOKEN_ENCRYPTION_KEY: ${{ secrets.KAKAO_TOKEN_ENCRYPTION_KEY }}
        run: python -m morning_radio.notify --plan output/episode-plan.json --url '${{ needs.deploy.outputs.page_url }}'
      - name: Persist rotated Kakao refresh token
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kakao_auth.json
          if git diff --cached --quiet; then
            echo "Kakao refresh token unchanged."
          else
            git commit -m "chore: rotate Kakao refresh token [skip ci]"
            git push
          fi
